# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = "nixpkgs"
home-manager = "home-manager"

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

[inputs.nixpkgs]
url = "https://channels.nixos.org/nixos-unstable/nixexprs.tar.xz"

[inputs.nixpkgs-kernel]
url = "gh:nixos/nixpkgs?rev=e2587caef70cea85dd97d7daab492899902dbf5d"

[inputs.home-manager]
url = "gh:nix-community/home-manager"

[inputs.stylix]
url = "gh:nix-community/stylix"

[inputs.helium-browser]
url = "gh:schembriaiden/helium-browser-nix-flake"

[inputs.niri-nix]
url = "git+https://codeberg.org/BANanaD3V/niri-nix"

[inputs.noctalia]
url = "gh:noctalia-dev/noctalia/cachix"

[inputs.noctalia-greetd]
url = "gh:noctalia-dev/noctalia-greeter"

[inputs.nixos-cli]
url = "gh:nix-community/nixos-cli"

[inputs.nvim]
url = "path:./pkgs/nvim-nixcats"

[inputs.hardware]
url = "gh:nixos/nixos-hardware"

[inputs.spicetify-nix]
url = "gh:Gerg-L/spicetify-nix"

[inputs.claude-code]
url = "gh:sadjow/claude-code-nix"

[inputs.gaze]
url = "gh:GunduLabs/gaze"

[inputs.nixcu]
url = "github:TotalyEnglizLitrate/nixcu"

[inputs.mangowc]
url = "gh:mangowm/mango"

[tack]
recomposable = true
